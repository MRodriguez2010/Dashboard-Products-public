<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPI Dashboard — Competitive Pricing Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f0f4ff;color:#0f172a;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .animate-in{animation:fadeIn .5s ease-out forwards}.pulse{animation:pulse 2s ease-in-out infinite}
    .container{max-width:1400px;margin:0 auto;padding:0 24px}

    /* Header */
    header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-bottom:1px solid #dbeafe}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
    .logo-area{display:flex;align-items:center;gap:14px}
    .logo-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#1e40af);display:flex;align-items:center;justify-content:center;color:#fff}
    .logo-icon svg{width:22px;height:22px}
    .header-title{font-size:20px;font-weight:700;color:#0f172a}
    .header-sub{font-size:13px;color:#64748b}
    .header-actions{display:flex;align-items:center;gap:10px}
    .live-dot{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}
    .live-dot span{width:8px;height:8px;border-radius:50%;background:#2563eb;display:inline-block}
    .btn{padding:6px 14px;font-size:13px;font-weight:600;border-radius:8px;border:none;cursor:pointer;transition:all .15s}
    .btn-export{background:#eff6ff;color:#1d4ed8}.btn-export:hover{background:#dbeafe}.btn-export:disabled{opacity:.5;cursor:not-allowed}

    /* Filter */
    .filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
    .filter-btn{padding:8px 16px;border-radius:12px;font-size:13px;font-weight:500;border:1px solid #dbeafe;background:#fff;color:#475569;cursor:pointer;transition:all .2s}
    .filter-btn:hover{border-color:#93c5fd}
    .filter-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.3)}

    /* KPI */
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
    @media(max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.kpi-grid{grid-template-columns:1fr}}
    .kpi-card{background:#fff;border-radius:16px;padding:24px;border:1px solid #eff6ff;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .2s}
    .kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.08)}
    .kpi-top{display:flex;justify-content:space-between;align-items:flex-start}
    .kpi-label{font-size:13px;font-weight:500;color:#64748b}
    .kpi-value{font-size:28px;font-weight:800;color:#0f172a;margin-top:8px}
    .kpi-sub{font-size:12px;color:#94a3b8;margin-top:4px}
    .kpi-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
    .kpi-icon svg{width:22px;height:22px;color:#fff}
    .grad-blue{background:linear-gradient(135deg,#2563eb,#1e40af)}
    .grad-emerald{background:linear-gradient(135deg,#10b981,#059669)}
    .grad-violet{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
    .grad-amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
    .grad-rose{background:linear-gradient(135deg,#f43f5e,#e11d48)}
    .grad-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2)}

    /* Panels */
    .chart-row{display:grid;gap:20px;margin-bottom:28px}
    .chart-row-2-1{grid-template-columns:2fr 1fr}
    .chart-row-1-1{grid-template-columns:1fr 1fr}
    .chart-row-3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:900px){.chart-row-2-1,.chart-row-1-1,.chart-row-3{grid-template-columns:1fr}}
    .panel{background:#fff;border-radius:16px;padding:24px;border:1px solid #eff6ff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .panel-title{font-size:17px;font-weight:700;color:#0f172a}
    .panel-sub{font-size:13px;color:#64748b;margin-top:2px}
    .chart-container{position:relative;height:300px}

    /* Table */
    .data-table{width:100%;border-collapse:collapse;font-size:14px}
    .data-table th{text-align:left;padding:12px 16px;font-weight:600;color:#475569;border-bottom:2px solid #eff6ff;font-size:13px}
    .data-table td{padding:12px 16px;border-bottom:1px solid #f8fafc}
    .data-table tr:hover{background:#f8fafc}
    .data-table .right{text-align:right}

    /* Badges */
    .tier-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:capitalize}
    .tier-budget{background:#ecfdf5;color:#059669}.tier-mid-range{background:#eff6ff;color:#2563eb}
    .tier-premium{background:#faf5ff;color:#7c3aed}.tier-enterprise{background:#fff7ed;color:#c2410c}

    /* Alert cards */
    .alert-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:8px;border:1px solid #f1f5f9;transition:all .15s}
    .alert-card:hover{border-color:#dbeafe;background:#f8fafc}
    .alert-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .alert-icon.up{background:#fef2f2;color:#ef4444}.alert-icon.down{background:#ecfdf5;color:#10b981}
    .alert-msg{font-size:13px;color:#334155;flex:1}.alert-pct{font-size:14px;font-weight:700}
    .alert-pct.up{color:#ef4444}.alert-pct.down{color:#10b981}
    .alert-date{font-size:11px;color:#94a3b8}

    /* Events */
    .event-card{padding:14px 16px;border-radius:12px;margin-bottom:8px;border-left:4px solid #2563eb;background:#fafbff}
    .event-title{font-size:14px;font-weight:600;color:#0f172a}
    .event-desc{font-size:12px;color:#64748b;margin-top:4px}
    .event-meta{font-size:11px;color:#94a3b8;margin-top:6px;text-transform:capitalize}

    /* Category stat cards */
    .cat-card{background:#fff;border-radius:14px;padding:20px;border:1px solid #eff6ff;text-align:center;transition:all .2s}
    .cat-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
    .cat-name{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:12px}
    .cat-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .cat-stat{padding:8px;border-radius:8px;background:#f8fafc}
    .cat-stat-val{font-size:16px;font-weight:700;color:#1e40af}
    .cat-stat-lbl{font-size:10px;color:#64748b;margin-top:2px}

    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh}
    .spinner{width:48px;height:48px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{margin-top:16px;font-size:16px;color:#64748b}
    footer{border-top:1px solid #dbeafe;background:#fff;padding:24px 0;margin-top:12px;text-align:center;font-size:13px;color:#94a3b8}
  </style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><p class="loading-text">Loading pricing intelligence...</p></div></div>
<script>
const API='/api/v1';
let selectedCategory=null;
let allData={};
let charts={};

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='className')e.className=v;
    else if(k==='onclick')e.onclick=v;
    else if(k==='disabled')e.disabled=v;
    else if(k==='innerHTML')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{if(c!=null)e.append(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}

async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('API '+r.status);return r.json()}

async function loadData(){
  const qs=selectedCategory?'?category_id='+selectedCategory:'';
  const[overview,competitors,trends,categories,distribution,alerts,events]=await Promise.all([
    fetchJSON(API+'/dashboard/overview'+qs),
    fetchJSON(API+'/dashboard/competitors'+qs),
    fetchJSON(API+'/dashboard/trends'+qs),
    fetchJSON(API+'/dashboard/categories'),
    fetchJSON(API+'/dashboard/distribution'+qs),
    fetchJSON(API+'/dashboard/alerts'),
    fetchJSON(API+'/dashboard/events'),
  ]);
  allData={overview,competitors,trends,categories,distribution,alerts,events};
  render();
}

async function handleExport(fmt){
  const btns=document.querySelectorAll('.btn-export');
  btns.forEach(b=>b.disabled=true);
  try{
    const res=await fetch(API+'/reports/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:fmt})});
    const blob=await res.blob();const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='cpi-report.'+fmt;a.click();URL.revokeObjectURL(url);
  }catch(e){console.error(e)}
  btns.forEach(b=>b.disabled=false);
}

function destroyCharts(){Object.values(charts).forEach(c=>c.destroy());charts={}}

function tierBadge(tier){
  const cls='tier-badge tier-'+(tier||'mid-range').replace(/\s/g,'-');
  return el('span',{className:cls},tier||'—');
}

function render(){
  destroyCharts();
  const{overview,competitors,trends,categories,distribution,alerts,events}=allData;
  const app=document.getElementById('app');
  app.innerHTML='';

  // HEADER
  const header=el('header',null,el('div',{className:'container'},
    el('div',{className:'header-inner'},
      el('div',{className:'logo-area'},
        el('div',{className:'logo-icon',innerHTML:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'}),
        el('div',null,el('div',{className:'header-title'},'Competitive Pricing Intelligence'),el('div',{className:'header-sub'},'Real-time market pricing analytics'))
      ),
      el('div',{className:'header-actions'},
        el('div',{className:'live-dot'},el('span',{className:'pulse'}),' Live'),
        ...['pdf','pptx','xlsx'].map(f=>el('button',{className:'btn btn-export',onclick:()=>handleExport(f)},f.toUpperCase()))
      )
    )
  ));
  app.append(header);
  const main=el('div',{className:'container',style:{paddingTop:'24px',paddingBottom:'24px'}});
  app.append(main);

  // FILTER
  const fb=el('div',{className:'filter-bar'});
  fb.append(el('button',{className:'filter-btn'+(selectedCategory===null?' active':''),onclick:()=>{selectedCategory=null;loadData()}},'All Categories'));
  categories.forEach(c=>fb.append(el('button',{className:'filter-btn'+(selectedCategory===c.category_id?' active':''),onclick:()=>{selectedCategory=c.category_id;loadData()}},c.category_name)));
  main.append(fb);

  // KPI CARDS
  const kpiGrid=el('div',{className:'kpi-grid animate-in'});
  const kpis=[
    {label:'Avg Market Price',value:'$'+overview.avg_price.toFixed(2),sub:'Median: $'+overview.median_price.toFixed(2),grad:'grad-blue',icon:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>'},
    {label:'Products Tracked',value:overview.total_products.toLocaleString(),sub:overview.total_competitors+' competitors',grad:'grad-violet',icon:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>'},
    {label:'Price Spread',value:'$'+overview.price_spread.toFixed(2),sub:'Min: $'+overview.min_price.toFixed(2)+' → Max: $'+overview.max_price.toFixed(2),grad:'grad-amber',icon:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>'},
    {label:'Price Alerts',value:overview.recent_alerts,sub:'Significant price changes',grad:'grad-rose',icon:'<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>'},
  ];
  kpis.forEach(k=>kpiGrid.append(el('div',{className:'kpi-card'},el('div',{className:'kpi-top'},el('div',null,el('div',{className:'kpi-label'},k.label),el('div',{className:'kpi-value'},k.value),el('div',{className:'kpi-sub'},k.sub)),el('div',{className:'kpi-icon '+k.grad,innerHTML:k.icon})))));
  main.append(kpiGrid);

  // ROW 1: Trend + Distribution
  const row1=el('div',{className:'chart-row chart-row-2-1'});
  const trendPanel=el('div',{className:'panel animate-in'});
  trendPanel.append(el('div',{className:'panel-title'},'Price Trends'),el('div',{className:'panel-sub',style:{marginBottom:'12px'}},'Monthly average pricing over time'));
  trendPanel.append(el('div',{className:'chart-container'},el('canvas',{id:'trendChart'})));
  row1.append(trendPanel);

  const distPanel=el('div',{className:'panel animate-in'});
  distPanel.append(el('div',{className:'panel-title'},'Price Distribution'),el('div',{className:'panel-sub',style:{marginBottom:'12px'}},'Products by price bucket'));
  distPanel.append(el('div',{className:'chart-container'},el('canvas',{id:'distChart'})));
  row1.append(distPanel);
  main.append(row1);

  // ROW 2: Competitor Bars + Category cards
  const row2=el('div',{className:'chart-row chart-row-2-1'});
  const compPanel=el('div',{className:'panel animate-in'});
  compPanel.append(el('div',{className:'panel-title'},'Competitor Pricing'),el('div',{className:'panel-sub',style:{marginBottom:'12px'}},'Average price by competitor'));
  compPanel.append(el('div',{className:'chart-container'},el('canvas',{id:'compChart'})));
  row2.append(compPanel);

  // Category breakdown cards
  const catPanel=el('div',{className:'panel animate-in'});
  catPanel.append(el('div',{className:'panel-title',style:{marginBottom:'12px'}},'Category Overview'));
  categories.forEach(cat=>{
    const card=el('div',{className:'cat-card',style:{marginBottom:'10px'}},
      el('div',{className:'cat-name'},cat.category_name),
      el('div',{className:'cat-stats'},
        el('div',{className:'cat-stat'},el('div',{className:'cat-stat-val'},'$'+cat.avg_price.toFixed(0)),el('div',{className:'cat-stat-lbl'},'Avg Price')),
        el('div',{className:'cat-stat'},el('div',{className:'cat-stat-val'},String(cat.competitor_count)),el('div',{className:'cat-stat-lbl'},'Competitors')),
      )
    );
    catPanel.append(card);
  });
  row2.append(catPanel);
  main.append(row2);

  // ROW 3: Market Share Donut + Alerts + Events
  const row3=el('div',{className:'chart-row chart-row-3'});

  const sharePanel=el('div',{className:'panel animate-in'});
  sharePanel.append(el('div',{className:'panel-title'},'Market Share'),el('div',{className:'panel-sub',style:{marginBottom:'12px'}},'Competitor market share %'));
  sharePanel.append(el('div',{style:{position:'relative',height:'260px'}},el('canvas',{id:'shareChart'})));
  row3.append(sharePanel);

  // Alerts
  const alertPanel=el('div',{className:'panel animate-in',style:{maxHeight:'380px',overflowY:'auto'}});
  alertPanel.append(el('div',{className:'panel-title',style:{marginBottom:'12px'}},'Recent Price Alerts'));
  (alerts||[]).slice(0,8).forEach(a=>{
    const isUp=a.alert_type==='price_increase';
    const card=el('div',{className:'alert-card'},
      el('div',{className:'alert-icon '+(isUp?'up':'down')},isUp?'↑':'↓'),
      el('div',null,el('div',{className:'alert-msg'},a.message||a.competitor_name),el('div',{className:'alert-date'},new Date(a.created_at).toLocaleDateString())),
      el('div',{className:'alert-pct '+(isUp?'up':'down')},(isUp?'+':'')+((a.change_pct||0).toFixed(1))+'%')
    );
    alertPanel.append(card);
  });
  if(!alerts||alerts.length===0)alertPanel.append(el('div',{style:{color:'#94a3b8',fontSize:'13px',textAlign:'center',padding:'20px'}},'No recent alerts'));
  row3.append(alertPanel);

  // Events
  const evPanel=el('div',{className:'panel animate-in',style:{maxHeight:'380px',overflowY:'auto'}});
  evPanel.append(el('div',{className:'panel-title',style:{marginBottom:'12px'}},'Market Events'));
  (events||[]).forEach(ev=>{
    evPanel.append(el('div',{className:'event-card'},
      el('div',{className:'event-title'},ev.title),
      el('div',{className:'event-desc'},ev.description),
      el('div',{className:'event-meta'},ev.event_type.replace(/_/g,' ')+' • '+new Date(ev.event_date).toLocaleDateString())
    ));
  });
  row3.append(evPanel);
  main.append(row3);

  // COMPETITOR TABLE
  const tablePanel=el('div',{className:'panel animate-in',style:{marginBottom:'28px',overflowX:'auto'}});
  tablePanel.append(el('div',{className:'panel-title',style:{marginBottom:'16px'}},'Competitor Detail'));
  const table=el('table',{className:'data-table'});
  table.append(el('thead',null,el('tr',null,
    el('th',null,'Competitor'),el('th',null,'Tier'),el('th',{className:'right'},'Products'),
    el('th',{className:'right'},'Avg Price'),el('th',{className:'right'},'Min'),el('th',{className:'right'},'Max'),el('th',{className:'right'},'Market Share')
  )));
  const tbody=el('tbody');
  competitors.forEach(c=>{
    tbody.append(el('tr',null,
      el('td',{style:{fontWeight:600}},c.competitor_name),
      el('td',null,tierBadge(c.tier)),
      el('td',{className:'right'},String(c.product_count)),
      el('td',{className:'right',style:{fontWeight:600,color:'#1e40af'}},'$'+c.avg_price.toFixed(2)),
      el('td',{className:'right'},'$'+c.min_price.toFixed(2)),
      el('td',{className:'right'},'$'+c.max_price.toFixed(2)),
      el('td',{className:'right'},c.market_share_pct.toFixed(1)+'%')
    ));
  });
  table.append(tbody);tablePanel.append(table);main.append(tablePanel);

  app.append(el('footer',null,el('div',{className:'container'},'Competitive Pricing Intelligence Dashboard • Real-Time Market Analytics')));

  createCharts(trends,distribution,competitors);
}

function createCharts(trends,distribution,competitors){
  const ff="'Inter',system-ui,sans-serif";
  Chart.defaults.font.family=ff;Chart.defaults.font.size=12;

  // Trend (area with min/max range)
  charts.trend=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{
      labels:trends.map(t=>t.period),
      datasets:[
        {label:'Max Price',data:trends.map(t=>t.max_price),borderColor:'rgba(239,68,68,0.3)',backgroundColor:'rgba(239,68,68,0.05)',fill:'+1',tension:.4,borderWidth:1.5,pointRadius:0},
        {label:'Avg Price',data:trends.map(t=>t.avg_price),borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,0.1)',fill:false,tension:.4,borderWidth:2.5,pointBackgroundColor:'#2563eb',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:4,pointHoverRadius:6},
        {label:'Min Price',data:trends.map(t=>t.min_price),borderColor:'rgba(16,185,129,0.3)',backgroundColor:'rgba(16,185,129,0.05)',fill:'-1',tension:.4,borderWidth:1.5,pointRadius:0},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,pointStyle:'circle',padding:16}}},
      scales:{y:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8',callback:v=>'$'+v}},x:{grid:{display:false},ticks:{color:'#94a3b8'}}}}
  });

  // Distribution (bar)
  const distColors=distribution.map((_,i)=>{const colors=['#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe','#dbeafe','#eff6ff'];return colors[i%colors.length]});
  charts.dist=new Chart(document.getElementById('distChart'),{
    type:'bar',
    data:{labels:distribution.map(d=>d.bucket),datasets:[{label:'Products',data:distribution.map(d=>d.count),backgroundColor:distColors,borderRadius:8,barThickness:28}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8'}},x:{grid:{display:false},ticks:{color:'#475569',font:{weight:500}}}}}
  });

  // Competitor horizontal bars
  const compColors=competitors.map(c=>{
    if(c.tier==='budget')return'#10b981';if(c.tier==='mid-range')return'#2563eb';if(c.tier==='premium')return'#8b5cf6';return'#f59e0b';
  });
  charts.comp=new Chart(document.getElementById('compChart'),{
    type:'bar',
    data:{labels:competitors.map(c=>c.competitor_name),datasets:[{label:'Avg Price',data:competitors.map(c=>c.avg_price),backgroundColor:compColors,borderRadius:6,barThickness:20}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'#f1f5f9'},ticks:{color:'#94a3b8',callback:v=>'$'+v}},y:{grid:{display:false},ticks:{color:'#475569',font:{size:11}}}}}
  });

  // Market share donut
  const shareData=competitors.filter(c=>c.market_share_pct>0);
  const sharePalette=['#2563eb','#3b82f6','#60a5fa','#06b6d4','#10b981','#8b5cf6','#f59e0b','#f43f5e','#ec4899','#94a3b8',
    '#1e40af','#059669','#7c3aed','#d97706','#e11d48','#64748b','#0891b2','#4f46e5','#16a34a','#ea580c'];
  charts.share=new Chart(document.getElementById('shareChart'),{
    type:'doughnut',
    data:{labels:shareData.map(c=>c.competitor_name),datasets:[{data:shareData.map(c=>c.market_share_pct),backgroundColor:sharePalette.slice(0,shareData.length),borderWidth:0,spacing:3,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',padding:8,font:{size:10}}}}}
  });
}

loadData().catch(err=>{
  console.error('Failed to load dashboard:',err);
  document.getElementById('app').innerHTML='<div class="loading"><p class="loading-text" style="color:#ef4444">Failed to load data. Check console.</p></div>';
});
</script>
</body>
</html>
