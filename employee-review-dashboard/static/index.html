<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESA Dashboard — Employee Sentiment Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    .animate-in { animation: fadeIn .5s ease-out forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    
    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    
    /* Header */
    header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.85); backdrop-filter: blur(16px); border-bottom: 1px solid #e2e8f0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .logo-icon { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; color: white; }
    .header-title { font-size: 20px; font-weight: 700; color: #0f172a; }
    .header-sub { font-size: 13px; color: #64748b; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .live-dot { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #64748b; }
    .live-dot span { width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block; }
    .btn { padding: 6px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all .15s; }
    .btn-export { background: #f1f5f9; color: #475569; }
    .btn-export:hover { background: #e2e8f0; }
    .btn-export:disabled { opacity: .5; cursor: not-allowed; }
    
    /* Filter bar */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .filter-btn { padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; border: 1px solid #e2e8f0; background: white; color: #475569; cursor: pointer; transition: all .2s; }
    .filter-btn:hover { border-color: #93c5fd; }
    .filter-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 4px 14px rgba(59,130,246,.3); }
    
    /* Cards grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
    @media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr; } }
    
    .kpi-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid #f1f5f9; box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: all .2s; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.08); }
    .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .kpi-label { font-size: 13px; font-weight: 500; color: #64748b; }
    .kpi-value { font-size: 30px; font-weight: 800; color: #0f172a; margin-top: 8px; }
    .kpi-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .kpi-icon svg { width: 22px; height: 22px; color: white; }
    .gradient-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .gradient-green { background: linear-gradient(135deg, #10b981, #059669); }
    .gradient-purple { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .gradient-amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
    
    /* Sentiment badge */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid; }
    .badge-positive { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
    .badge-neutral { background: #fffbeb; color: #d97706; border-color: #fde68a; }
    .badge-negative { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .badge-dot { width: 7px; height: 7px; border-radius: 50%; }
    
    /* Chart panels */
    .chart-row { display: grid; gap: 20px; margin-bottom: 28px; }
    .chart-row-2-1 { grid-template-columns: 2fr 1fr; }
    .chart-row-1-1 { grid-template-columns: 1fr 1fr; }
    @media (max-width: 900px) { .chart-row-2-1, .chart-row-1-1 { grid-template-columns: 1fr; } }
    
    .panel { background: white; border-radius: 16px; padding: 24px; border: 1px solid #f1f5f9; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-title { font-size: 17px; font-weight: 700; color: #0f172a; }
    .panel-sub { font-size: 13px; color: #64748b; margin-top: 2px; }
    .chart-container { position: relative; height: 300px; }
    
    /* Donut stats row */
    .donut-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .donut-stat { text-align: center; padding: 12px 8px; border-radius: 12px; }
    .donut-stat-value { font-size: 22px; font-weight: 800; }
    .donut-stat-label { font-size: 11px; font-weight: 500; margin-top: 2px; }
    
    /* Company cards */
    .company-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    @media (max-width: 1024px) { .company-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .company-grid { grid-template-columns: 1fr; } }
    .company-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #f1f5f9; box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: all .2s; }
    .company-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.08); }
    .company-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .company-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 15px; }
    .company-name { font-size: 14px; font-weight: 600; color: #0f172a; }
    .company-reviews { font-size: 12px; color: #94a3b8; }
    .company-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .company-stat { text-align: center; background: #f8fafc; padding: 10px 8px; border-radius: 10px; }
    .company-stat-value { font-size: 18px; font-weight: 700; }
    .company-stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }
    
    /* Topic table */
    .topic-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .topic-table th { text-align: left; padding: 12px 16px; font-weight: 600; color: #475569; border-bottom: 2px solid #f1f5f9; font-size: 13px; }
    .topic-table td { padding: 12px 16px; border-bottom: 1px solid #f8fafc; }
    .topic-table tr:hover { background: #f8fafc; }
    .topic-table .right { text-align: right; }
    .bar-container { display: flex; gap: 2px; align-items: center; }
    .bar-segment { height: 8px; border-radius: 4px; }
    
    /* Loading */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; font-size: 16px; color: #64748b; }
    
    /* Footer */
    footer { border-top: 1px solid #e2e8f0; background: white; padding: 24px 0; margin-top: 12px; text-align: center; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p class="loading-text">Loading sentiment data...</p>
    </div>
  </div>

  <script>
    // ─── Config ───
    const API = '/api/v1';
    let selectedCompanies = [];
    let allData = {};

    // ─── Utilities ───
    function sentimentColor(s) {
      return s > 0.3 ? '#10b981' : s > 0.05 ? '#34d399' : s > -0.05 ? '#f59e0b' : s > -0.3 ? '#f87171' : '#ef4444';
    }
    function sentimentLabel(s) {
      return s > 0.3 ? 'Very Positive' : s > 0.05 ? 'Positive' : s > -0.05 ? 'Neutral' : s > -0.3 ? 'Negative' : 'Very Negative';
    }
    function sentimentBadgeClass(s) {
      return s > 0.05 ? 'badge-positive' : s > -0.05 ? 'badge-neutral' : 'badge-negative';
    }
    function topicLabel(t) {
      return t.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }
    function el(tag, attrs, ...children) {
      const e = document.createElement(tag);
      if (attrs) Object.entries(attrs).forEach(([k,v]) => {
        if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k === 'className') e.className = v;
        else if (k === 'onclick') e.onclick = v;
        else if (k === 'disabled') e.disabled = v;
        else if (k === 'innerHTML') e.innerHTML = v;
        else e.setAttribute(k, v);
      });
      children.flat().forEach(c => { if (c != null) e.append(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }

    // ─── Data fetching ───
    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }

    async function loadData() {
      const qs = selectedCompanies.length > 0 ? '?company_ids=' + selectedCompanies.join(',') : '';
      const [overview, trends, topics, companies, companyList] = await Promise.all([
        fetchJSON(API + '/dashboard/overview' + qs),
        fetchJSON(API + '/dashboard/trends' + qs),
        fetchJSON(API + '/dashboard/topics' + qs),
        fetchJSON(API + '/dashboard/companies' + qs),
        fetchJSON(API + '/companies'),
      ]);
      allData = { overview, trends, topics, companies, companyList };
      render();
    }

    async function handleExport(fmt) {
      const btns = document.querySelectorAll('.btn-export');
      btns.forEach(b => b.disabled = true);
      try {
        const res = await fetch(API + '/reports/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            format: fmt,
            company_ids: selectedCompanies.length ? selectedCompanies : null,
            include_sections: ['overview', 'trends', 'topics', 'companies', 'recommendations']
          })
        });
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'esa-report.' + fmt; a.click();
        URL.revokeObjectURL(url);
      } catch(e) { console.error(e); }
      btns.forEach(b => b.disabled = false);
    }

    function toggleCompany(id) {
      const idx = selectedCompanies.indexOf(id);
      if (idx >= 0) selectedCompanies.splice(idx, 1);
      else selectedCompanies.push(id);
      loadData();
    }

    // ─── Chart instances (destroy before recreate) ───
    let charts = {};
    function destroyCharts() {
      Object.values(charts).forEach(c => c.destroy());
      charts = {};
    }

    // ─── Render ───
    function render() {
      destroyCharts();
      const { overview, trends, topics, companies, companyList } = allData;
      const app = document.getElementById('app');
      app.innerHTML = '';

      // === HEADER ===
      const header = el('header', null,
        el('div', { className: 'container' },
          el('div', { className: 'header-inner' },
            el('div', { className: 'logo-area' },
              el('div', { className: 'logo-icon', innerHTML: '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>' }),
              el('div', null,
                el('div', { className: 'header-title' }, 'Employee Sentiment Intelligence'),
                el('div', { className: 'header-sub' }, 'Real-time analytics across review platforms')
              )
            ),
            el('div', { className: 'header-actions' },
              el('div', { className: 'live-dot' }, el('span', { className: 'pulse' }), ' Live'),
              ...['pdf', 'pptx', 'xlsx'].map(f =>
                el('button', { className: 'btn btn-export', onclick: () => handleExport(f) }, f.toUpperCase())
              )
            )
          )
        )
      );
      app.append(header);

      const main = el('div', { className: 'container', style: { paddingTop: '24px', paddingBottom: '24px' } });
      app.append(main);

      // === FILTER BAR ===
      const filterBar = el('div', { className: 'filter-bar' });
      const allBtn = el('button', {
        className: 'filter-btn' + (selectedCompanies.length === 0 ? ' active' : ''),
        onclick: () => { selectedCompanies = []; loadData(); }
      }, 'All Companies');
      filterBar.append(allBtn);
      companyList.forEach(c => {
        filterBar.append(el('button', {
          className: 'filter-btn' + (selectedCompanies.includes(c.id) ? ' active' : ''),
          onclick: () => toggleCompany(c.id)
        }, c.name));
      });
      main.append(filterBar);

      // === KPI CARDS ===
      const kpiGrid = el('div', { className: 'kpi-grid animate-in' });
      const kpis = [
        { label: 'Overall Sentiment', value: overview.avg_sentiment.toFixed(3), sub: sentimentLabel(overview.avg_sentiment), gradient: 'gradient-blue', icon: '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
        { label: 'Total Reviews', value: overview.total_reviews.toLocaleString(), sub: 'Across ' + overview.total_companies + ' companies', gradient: 'gradient-purple', icon: '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>' },
        { label: 'Positive Rate', value: overview.positive_pct.toFixed(0) + '%', sub: overview.negative_pct.toFixed(0) + '% negative', gradient: 'gradient-green', icon: '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' },
        { label: 'Avg Rating', value: overview.avg_rating.toFixed(1) + ' / 5.0', sub: overview.trending_topics.length + ' topics tracked', gradient: 'gradient-amber', icon: '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>' },
      ];
      kpis.forEach(k => {
        kpiGrid.append(el('div', { className: 'kpi-card' },
          el('div', { className: 'kpi-top' },
            el('div', null,
              el('div', { className: 'kpi-label' }, k.label),
              el('div', { className: 'kpi-value' }, k.value),
              el('div', { className: 'kpi-sub' }, k.sub)
            ),
            el('div', { className: 'kpi-icon ' + k.gradient, innerHTML: k.icon })
          )
        ));
      });
      main.append(kpiGrid);

      // === ROW 1: Trend + Donut ===
      const row1 = el('div', { className: 'chart-row chart-row-2-1' });
      
      // Trend chart
      const trendPanel = el('div', { className: 'panel animate-in' });
      const trendHeader = el('div', { className: 'panel-header' },
        el('div', null,
          el('div', { className: 'panel-title' }, 'Sentiment Trend'),
          el('div', { className: 'panel-sub' }, 'Monthly average sentiment over time')
        ),
        el('span', { className: 'badge ' + sentimentBadgeClass(overview.avg_sentiment) },
          el('span', { className: 'badge-dot', style: { background: sentimentColor(overview.avg_sentiment) } }),
          overview.avg_sentiment.toFixed(3)
        )
      );
      trendPanel.append(trendHeader);
      const trendCanvas = el('canvas', { id: 'trendChart' });
      trendPanel.append(el('div', { className: 'chart-container' }, trendCanvas));
      row1.append(trendPanel);

      // Donut chart
      const donutPanel = el('div', { className: 'panel animate-in' });
      donutPanel.append(
        el('div', { className: 'panel-title' }, 'Sentiment Distribution'),
        el('div', { className: 'panel-sub', style: { marginBottom: '12px' } }, 'Review classification breakdown')
      );
      const donutCanvas = el('canvas', { id: 'donutChart' });
      donutPanel.append(el('div', { style: { position: 'relative', height: '220px' } }, donutCanvas));
      const donutStats = el('div', { className: 'donut-stats' });
      [
        { v: overview.positive_pct, l: 'Positive', bg: '#ecfdf5', c: '#059669' },
        { v: overview.neutral_pct, l: 'Neutral', bg: '#fffbeb', c: '#d97706' },
        { v: overview.negative_pct, l: 'Negative', bg: '#fef2f2', c: '#dc2626' },
      ].forEach(s => {
        donutStats.append(el('div', { className: 'donut-stat', style: { background: s.bg } },
          el('div', { className: 'donut-stat-value', style: { color: s.c } }, s.v.toFixed(0) + '%'),
          el('div', { className: 'donut-stat-label', style: { color: s.c } }, s.l)
        ));
      });
      donutPanel.append(donutStats);
      row1.append(donutPanel);
      main.append(row1);

      // === ROW 2: Topic Bar + Topic Radar ===
      const row2 = el('div', { className: 'chart-row chart-row-1-1' });
      
      const topicBarPanel = el('div', { className: 'panel animate-in' });
      topicBarPanel.append(
        el('div', { className: 'panel-title' }, 'Topic Analysis'),
        el('div', { className: 'panel-sub', style: { marginBottom: '12px' } }, 'Mentions by topic, colored by sentiment')
      );
      const topicBarCanvas = el('canvas', { id: 'topicBarChart' });
      topicBarPanel.append(el('div', { className: 'chart-container' }, topicBarCanvas));
      row2.append(topicBarPanel);

      const radarPanel = el('div', { className: 'panel animate-in' });
      radarPanel.append(
        el('div', { className: 'panel-title' }, 'Topic Radar'),
        el('div', { className: 'panel-sub', style: { marginBottom: '12px' } }, 'Multi-dimensional sentiment profile')
      );
      const radarCanvas = el('canvas', { id: 'radarChart' });
      radarPanel.append(el('div', { className: 'chart-container' }, radarCanvas));
      row2.append(radarPanel);
      main.append(row2);

      // === Company Comparison Bar ===
      const compBarPanel = el('div', { className: 'panel animate-in', style: { marginBottom: '28px' } });
      compBarPanel.append(
        el('div', { className: 'panel-title' }, 'Company Comparison'),
        el('div', { className: 'panel-sub', style: { marginBottom: '12px' } }, 'Average sentiment by company')
      );
      const compBarCanvas = el('canvas', { id: 'compBarChart' });
      compBarPanel.append(el('div', { className: 'chart-container' }, compBarCanvas));
      main.append(compBarPanel);

      // === Topic Detail Table ===
      const tablePanel = el('div', { className: 'panel animate-in', style: { marginBottom: '28px', overflowX: 'auto' } });
      tablePanel.append(el('div', { className: 'panel-title', style: { marginBottom: '16px' } }, 'Topic Detail'));
      const table = el('table', { className: 'topic-table' });
      const thead = el('thead', null, el('tr', null,
        el('th', null, 'Topic'), el('th', { className: 'right' }, 'Mentions'),
        el('th', { className: 'right' }, 'Avg Sentiment'), el('th', { className: 'right' }, 'Positive'),
        el('th', { className: 'right' }, 'Negative'), el('th', null, 'Distribution')
      ));
      table.append(thead);
      const tbody = el('tbody');
      topics.forEach(t => {
        const badge = el('span', { className: 'badge ' + sentimentBadgeClass(t.avg_sentiment), style: { fontSize: '12px', padding: '2px 8px' } },
          el('span', { className: 'badge-dot', style: { background: sentimentColor(t.avg_sentiment), width: '6px', height: '6px' } }),
          t.avg_sentiment.toFixed(3)
        );
        const bar = el('div', { className: 'bar-container' },
          el('div', { className: 'bar-segment', style: { width: Math.min(t.positive_pct, 100) * 1.2 + 'px', background: '#10b981' } }),
          el('div', { className: 'bar-segment', style: { width: Math.min(t.negative_pct, 100) * 1.2 + 'px', background: '#ef4444' } })
        );
        tbody.append(el('tr', null,
          el('td', { style: { fontWeight: 600 } }, topicLabel(t.topic)),
          el('td', { className: 'right' }, String(t.count)),
          el('td', { className: 'right' }, badge),
          el('td', { className: 'right', style: { color: '#059669' } }, t.positive_pct.toFixed(1) + '%'),
          el('td', { className: 'right', style: { color: '#ef4444' } }, t.negative_pct.toFixed(1) + '%'),
          el('td', null, bar)
        ));
      });
      table.append(tbody);
      tablePanel.append(table);
      main.append(tablePanel);

      // === Company Profile Cards ===
      const compSection = el('div', { style: { marginBottom: '28px' } });
      compSection.append(el('div', { className: 'panel-title', style: { marginBottom: '16px' } }, 'Company Profiles'));
      const compGrid = el('div', { className: 'company-grid' });
      companies.forEach(c => {
        const card = el('div', { className: 'company-card animate-in' },
          el('div', { className: 'company-header' },
            el('div', { className: 'company-avatar', style: { background: sentimentColor(c.avg_sentiment) } }, c.company_name.charAt(0)),
            el('div', null,
              el('div', { className: 'company-name' }, c.company_name),
              el('div', { className: 'company-reviews' }, c.review_count + ' reviews')
            )
          ),
          el('div', { className: 'company-stats' },
            el('div', { className: 'company-stat' },
              el('div', { className: 'company-stat-value', style: { color: sentimentColor(c.avg_sentiment) } }, c.avg_sentiment.toFixed(2)),
              el('div', { className: 'company-stat-label' }, 'Sentiment')
            ),
            el('div', { className: 'company-stat' },
              el('div', { className: 'company-stat-value', style: { color: '#d97706' } }, c.avg_rating.toFixed(1)),
              el('div', { className: 'company-stat-label' }, 'Rating')
            )
          )
        );
        compGrid.append(card);
      });
      compSection.append(compGrid);
      main.append(compSection);

      // === Footer ===
      app.append(el('footer', null,
        el('div', { className: 'container' }, 'Employee Sentiment Intelligence Dashboard \u2022 Powered by NLP & Real-Time Analytics')
      ));

      // ─── Create Charts ───
      createCharts(trends, topics, companies, overview);
    }

    function createCharts(trends, topics, companies, overview) {
      const fontFamily = "'Inter', system-ui, sans-serif";
      Chart.defaults.font.family = fontFamily;
      Chart.defaults.font.size = 12;

      // 1. Trend Area Chart
      charts.trend = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: trends.map(t => t.period),
          datasets: [{
            label: 'Avg Sentiment',
            data: trends.map(t => t.avg_sentiment),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 2.5,
            pointBackgroundColor: '#3b82f6',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { min: -0.2, max: 1, grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8' } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          }
        }
      });

      // 2. Donut Chart
      charts.donut = new Chart(document.getElementById('donutChart'), {
        type: 'doughnut',
        data: {
          labels: ['Positive', 'Neutral', 'Negative'],
          datasets: [{
            data: [overview.positive_pct, overview.neutral_pct, overview.negative_pct],
            backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
            borderWidth: 0,
            spacing: 4,
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          cutout: '65%',
          plugins: { legend: { display: false } }
        }
      });

      // 3. Topic Horizontal Bar
      charts.topicBar = new Chart(document.getElementById('topicBarChart'), {
        type: 'bar',
        data: {
          labels: topics.map(t => topicLabel(t.topic)),
          datasets: [{
            label: 'Mentions',
            data: topics.map(t => t.count),
            backgroundColor: topics.map(t => sentimentColor(t.avg_sentiment)),
            borderRadius: 6,
            barThickness: 22,
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8' } },
            y: { grid: { display: false }, ticks: { color: '#475569', font: { weight: 500 } } }
          }
        }
      });

      // 4. Radar Chart
      const radarTopics = topics.slice(0, 8);
      charts.radar = new Chart(document.getElementById('radarChart'), {
        type: 'radar',
        data: {
          labels: radarTopics.map(t => topicLabel(t.topic)),
          datasets: [{
            label: 'Sentiment',
            data: radarTopics.map(t => Math.max(0, (t.avg_sentiment + 1) * 50)),
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.15)',
            borderWidth: 2,
            pointBackgroundColor: '#3b82f6',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 4,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              min: 0, max: 100,
              grid: { color: '#e2e8f0' },
              angleLines: { color: '#e2e8f0' },
              pointLabels: { color: '#64748b', font: { size: 11 } },
              ticks: { display: false }
            }
          }
        }
      });

      // 5. Company Comparison Bar
      charts.compBar = new Chart(document.getElementById('compBarChart'), {
        type: 'bar',
        data: {
          labels: companies.map(c => c.company_name),
          datasets: [{
            label: 'Avg Sentiment',
            data: companies.map(c => c.avg_sentiment),
            backgroundColor: companies.map(c => sentimentColor(c.avg_sentiment)),
            borderRadius: 6,
            barThickness: 36,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { min: -0.2, max: 1, grid: { color: '#f1f5f9' }, ticks: { color: '#94a3b8' } },
            x: { grid: { display: false }, ticks: { color: '#475569', maxRotation: 35, font: { size: 11 } } }
          }
        }
      });
    }

    // ─── Initialize ───
    loadData().catch(err => {
      console.error('Failed to load dashboard:', err);
      document.getElementById('app').innerHTML = '<div class="loading"><p class="loading-text" style="color:#ef4444">Failed to load data. Check console for details.</p></div>';
    });
  </script>
</body>
</html>
