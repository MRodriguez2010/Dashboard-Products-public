<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Churn & Revenue Leak</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0c0a1d;color:#e2e8f0;min-height:100vh}
        .header{background:linear-gradient(135deg,#3b0764 0%,#7c3aed 50%,#a855f7 100%);padding:24px 32px;display:flex;justify-content:space-between;align-items:center}
        .header h1{font-size:24px;font-weight:700} .header h1 span{color:#c4b5fd}
        .controls{display:flex;gap:10px}
        .btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
        .btn-pdf{background:#ef4444;color:#fff}.btn-pptx{background:#f97316;color:#fff}.btn-xlsx{background:#22c55e;color:#fff}
        .btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
        .container{max-width:1440px;margin:0 auto;padding:24px}
        .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
        .kpi{background:linear-gradient(135deg,#1e1b3a,#2d2755);border-radius:12px;padding:18px;border:1px solid #3b3666}
        .kpi .label{font-size:11px;color:#a78bfa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
        .kpi .val{font-size:26px;font-weight:700}
        .kpi .sub{font-size:11px;color:#7c6fae;margin-top:3px}
        .kpi:nth-child(1) .val{color:#67e8f9} .kpi:nth-child(2) .val{color:#34d399} .kpi:nth-child(3) .val{color:#ef4444}
        .kpi:nth-child(4) .val{color:#fbbf24} .kpi:nth-child(5) .val{color:#f472b6}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
        .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:24px}
        .card{background:#1e1b3a;border-radius:12px;padding:20px;border:1px solid #3b3666}
        .card h3{font-size:15px;font-weight:600;margin-bottom:14px;color:#e9e5ff;display:flex;align-items:center;gap:8px}
        .chart-box{position:relative;height:280px}
        .tbl{width:100%;border-collapse:collapse;font-size:12px}
        .tbl th{background:#2d2755;color:#a78bfa;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
        .tbl td{padding:8px 10px;border-bottom:1px solid #2d2755}
        .tbl tr:hover{background:rgba(124,58,237,.1)}
        .risk-high{color:#ef4444;font-weight:700} .risk-med{color:#fbbf24;font-weight:600} .risk-low{color:#34d399}
        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
        .badge-crit{background:rgba(239,68,68,.2);color:#ef4444}
        .badge-warn{background:rgba(251,191,36,.2);color:#fbbf24}
        .badge-ok{background:rgba(52,211,153,.2);color:#34d399}
        @media(max-width:1024px){.grid-2,.grid-3{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
<div class="header">
    <h1>📉 Subscription Churn & <span>Revenue Leak</span></h1>
    <div class="controls">
        <button class="btn btn-pdf" onclick="exportReport('pdf')">📄 PDF</button>
        <button class="btn btn-pptx" onclick="exportReport('pptx')">📊 PPTX</button>
        <button class="btn btn-xlsx" onclick="exportReport('xlsx')">📗 XLSX</button>
    </div>
</div>
<div class="container">
    <div class="kpi-row" id="kpis"></div>
    <div class="grid-2">
        <div class="card"><h3>📈 MRR Trend</h3><div class="chart-box"><canvas id="mrrChart"></canvas></div></div>
        <div class="card"><h3>📊 Churn Rate Trend</h3><div class="chart-box"><canvas id="churnTrendChart"></canvas></div></div>
    </div>
    <div class="grid-3">
        <div class="card"><h3>🎯 Churn Reasons</h3><div class="chart-box"><canvas id="reasonsChart"></canvas></div></div>
        <div class="card"><h3>💳 Plan Breakdown</h3><div class="chart-box"><canvas id="planChart"></canvas></div></div>
        <div class="card"><h3>❤️ Health Distribution</h3><div class="chart-box"><canvas id="healthChart"></canvas></div></div>
    </div>
    <div class="grid-2">
        <div class="card"><h3>📉 Revenue Waterfall</h3><div class="chart-box"><canvas id="waterfallChart"></canvas></div></div>
        <div class="card"><h3>🔄 Engagement Trends</h3><div class="chart-box"><canvas id="engageChart"></canvas></div></div>
    </div>
    <div class="grid-2">
        <div class="card"><h3>🗓️ Cohort Retention</h3><div class="chart-box"><canvas id="cohortChart"></canvas></div></div>
        <div class="card">
            <h3>⚠️ At-Risk Subscribers</h3>
            <div style="max-height:320px;overflow-y:auto">
                <table class="tbl" id="riskTable"><thead><tr><th>Company</th><th>Plan</th><th>MRR</th><th>Risk</th><th>Health</th><th>Last Login</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </div>
</div>
<script>
const API='/api/v1';
let charts={};
async function fetchJSON(u){return(await fetch(u)).json()}

async function loadKPIs(){
    const d=await fetchJSON(API+'/dashboard/overview');
    document.getElementById('kpis').innerHTML=`
        <div class="kpi"><div class="label">Active Subscribers</div><div class="val">${d.active_subscribers}</div><div class="sub">of ${d.total_subscribers} total</div></div>
        <div class="kpi"><div class="label">Monthly MRR</div><div class="val">$${Number(d.total_mrr).toLocaleString()}</div><div class="sub">Avg LTV: $${Number(d.avg_ltv).toLocaleString()}</div></div>
        <div class="kpi"><div class="label">Churn Rate</div><div class="val">${d.churn_rate}%</div><div class="sub">${d.churned_subscribers} churned</div></div>
        <div class="kpi"><div class="label">At-Risk MRR</div><div class="val">$${Number(d.at_risk_mrr).toLocaleString()}</div><div class="sub">${d.high_risk_count} high-risk accounts</div></div>
        <div class="kpi"><div class="label">Avg Health Score</div><div class="val">${d.avg_health_score}</div><div class="sub">out of 100</div></div>`;
}

async function loadMRR(){
    const d=await fetchJSON(API+'/dashboard/revenue-trends');
    if(charts.mrr)charts.mrr.destroy();
    charts.mrr=new Chart(document.getElementById('mrrChart'),{type:'line',
        data:{labels:d.map(r=>r.month),datasets:[
            {label:'MRR',data:d.map(r=>r.mrr),borderColor:'#a78bfa',backgroundColor:'rgba(167,139,250,.1)',fill:true,tension:.4},
            {label:'New MRR',data:d.map(r=>r.new_mrr),borderColor:'#34d399',borderDash:[5,5],tension:.4},
            {label:'Churned MRR',data:d.map(r=>r.churned_mrr),borderColor:'#ef4444',borderDash:[5,5],tension:.4}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a78bfa'}}},
        scales:{x:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}},y:{ticks:{color:'#6b5fa0',callback:v=>'$'+v.toLocaleString()},grid:{color:'#2d2755'}}}}});
}

async function loadChurnTrend(){
    const d=await fetchJSON(API+'/dashboard/revenue-trends');
    if(charts.churnT)charts.churnT.destroy();
    charts.churnT=new Chart(document.getElementById('churnTrendChart'),{type:'bar',
        data:{labels:d.map(r=>r.month),datasets:[
            {label:'Churn Rate %',data:d.map(r=>r.churn_rate),backgroundColor:'rgba(239,68,68,.6)',borderRadius:4},
            {label:'Rev Churn %',data:d.map(r=>r.revenue_churn_rate),backgroundColor:'rgba(251,191,36,.6)',borderRadius:4}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a78bfa'}}},
        scales:{x:{ticks:{color:'#6b5fa0'},grid:{display:false}},y:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}}}}});
}

async function loadReasons(){
    const d=await fetchJSON(API+'/dashboard/churn-reasons');
    if(charts.reasons)charts.reasons.destroy();
    charts.reasons=new Chart(document.getElementById('reasonsChart'),{type:'bar',
        data:{labels:d.map(r=>r.reason),datasets:[{label:'Count',data:d.map(r=>r.count),
        backgroundColor:['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#67e8f9','#a3e635','#f472b6'],borderRadius:4}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}},y:{ticks:{color:'#c4b5fd',font:{size:10}},grid:{display:false}}}}});
}

async function loadPlans(){
    const d=await fetchJSON(API+'/dashboard/plan-breakdown');
    if(charts.plan)charts.plan.destroy();
    charts.plan=new Chart(document.getElementById('planChart'),{type:'doughnut',
        data:{labels:d.map(r=>r.plan+' ($'+r.price+')'),datasets:[{data:d.map(r=>r.total),
        backgroundColor:['#64748b','#3b82f6','#8b5cf6','#f97316','#ef4444'],borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#c4b5fd',font:{size:11},padding:8}}}}});
}

async function loadHealth(){
    const d=await fetchJSON(API+'/dashboard/health-distribution');
    if(charts.health)charts.health.destroy();
    const colors=['#ef4444','#f97316','#eab308','#22c55e','#10b981'];
    charts.health=new Chart(document.getElementById('healthChart'),{type:'bar',
        data:{labels:d.map(r=>r.label),datasets:[{label:'Subscribers',data:d.map(r=>r.count),backgroundColor:colors,borderRadius:6}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:'#c4b5fd'},grid:{display:false}},y:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}}}}});
}

async function loadWaterfall(){
    const d=await fetchJSON(API+'/dashboard/revenue-trends');
    const last=d[d.length-1];
    if(charts.waterfall)charts.waterfall.destroy();
    charts.waterfall=new Chart(document.getElementById('waterfallChart'),{type:'bar',
        data:{labels:['Starting MRR','+ New','+ Expansion','- Churned','= Net MRR'],
        datasets:[{data:[last.mrr-last.net_mrr,last.new_mrr,last.expansion_mrr,-last.churned_mrr,last.net_mrr],
        backgroundColor:['#64748b','#22c55e','#3b82f6','#ef4444','#a78bfa'],borderRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{ticks:{color:'#c4b5fd'},grid:{display:false}},y:{ticks:{color:'#6b5fa0',callback:v=>'$'+Math.abs(v).toLocaleString()},grid:{color:'#2d2755'}}}}});
}

async function loadEngagement(){
    const d=await fetchJSON(API+'/dashboard/engagement-trends');
    if(charts.engage)charts.engage.destroy();
    charts.engage=new Chart(document.getElementById('engageChart'),{type:'line',
        data:{labels:d.map(r=>r.month),datasets:[
            {label:'Engagement',data:d.map(r=>r.engagement),borderColor:'#a78bfa',tension:.4},
            {label:'Logins',data:d.map(r=>r.logins),borderColor:'#67e8f9',tension:.4},
            {label:'Features',data:d.map(r=>r.features),borderColor:'#34d399',tension:.4}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a78bfa'}}},
        scales:{x:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}},y:{ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}}}}});
}

async function loadCohort(){
    const d=await fetchJSON(API+'/dashboard/cohort');
    if(charts.cohort)charts.cohort.destroy();
    charts.cohort=new Chart(document.getElementById('cohortChart'),{type:'bar',
        data:{labels:d.map(r=>r.cohort),datasets:[
            {label:'Retained',data:d.map(r=>r.retained),backgroundColor:'rgba(52,211,153,.7)',borderRadius:4},
            {label:'Churned',data:d.map(r=>r.churned),backgroundColor:'rgba(239,68,68,.7)',borderRadius:4}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a78bfa'}}},
        scales:{x:{stacked:true,ticks:{color:'#6b5fa0'},grid:{display:false}},y:{stacked:true,ticks:{color:'#6b5fa0'},grid:{color:'#2d2755'}}}}});
}

async function loadRiskTable(){
    const d=await fetchJSON(API+'/dashboard/at-risk?limit=15');
    document.querySelector('#riskTable tbody').innerHTML=d.map(r=>{
        const cls=r.churn_risk>.7?'risk-high':r.churn_risk>.5?'risk-med':'risk-low';
        const badge=r.churn_risk>.7?'badge-crit':r.churn_risk>.5?'badge-warn':'badge-ok';
        return `<tr><td><strong>${r.company}</strong></td><td>${r.plan}</td><td>$${r.mrr}</td>
        <td><span class="badge ${badge}">${(r.churn_risk*100).toFixed(0)}%</span></td>
        <td class="${cls}">${r.health_score}</td><td>${r.last_login_days}d ago</td></tr>`;
    }).join('');
}

function exportReport(fmt){
    fetch(API+'/reports/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:fmt})})
    .then(r=>r.blob()).then(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='churn_report.'+fmt;a.click();URL.revokeObjectURL(u)});
}

Promise.all([loadKPIs(),loadMRR(),loadChurnTrend(),loadReasons(),loadPlans(),loadHealth(),loadWaterfall(),loadEngagement(),loadCohort(),loadRiskTable()]);
</script>
</body>
</html>
